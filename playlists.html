<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTube - Playlists</title>
    <link rel="shortcut icon" href="img/jtubeimg.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-900 text-white font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-zinc-900 flex items-center justify-between px-6 py-4 border-b border-zinc-800">
        <a href="index.html" class="flex items-center space-x-1 text-2xl font-black tracking-tighter brand-font"><span class="bg-gradient-to-br from-red-600 to-red-800 text-white px-2.5 py-0.5 rounded-lg shadow-lg shadow-red-600/20">J</span><span class="brand-logo-text">Tube</span></a>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-6">Course Playlists</h1>
        
        <div id="playlists-loading" class="text-center py-20 text-zinc-500">Loading playlists...</div>
        
        <div id="playlists-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Playlists load here -->
        </div>

        <!-- Video Modal for Playlist View (YouTube Style) -->
        <div id="playlist-modal" class="fixed inset-0 z-[100] bg-[#0f0f0f] hidden flex-col sm:flex-row overflow-hidden">
            <!-- Close button floating -->
            <button id="close-playlist" class="absolute top-4 right-4 z-50 bg-black/50 hover:bg-black p-2 rounded-full text-white transition">
                <i class="fas fa-times text-xl w-6 h-6 flex items-center justify-center"></i>
            </button>
            
            <!-- Left Panel (Sidebar) -->
            <div class="w-full sm:w-[380px] md:w-[420px] h-[45vh] sm:h-full flex-shrink-0 relative overflow-hidden flex flex-col p-6 sm:p-8 pt-12 sm:pt-8" id="modal-left-panel">
                <!-- Blurred Background -->
                <div id="modal-bg-img" class="absolute inset-0 bg-cover bg-center blur-3xl opacity-40 scale-150 transform"></div>
                <!-- Gradient overlay -->
                <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#0f0f0f] sm:bg-gradient-to-t"></div>
                
                <div class="relative z-10 flex flex-col h-full">
                    <!-- Thumbnail -->
                    <div class="w-full aspect-video rounded-xl overflow-hidden shadow-2xl mb-6 flex-shrink-0 relative group cursor-pointer">
                        <img id="modal-playlist-thumb" src="" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                            <div class="flex items-center space-x-2 text-white font-semibold">
                                <i class="fas fa-play"></i>
                                <span>Play all</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Info -->
                    <h2 class="text-2xl sm:text-3xl font-bold text-white mb-4 line-clamp-2 leading-tight" id="modal-playlist-name">Playlist Name</h2>
                    
                    <div class="space-y-1 mb-6">
                        <p class="text-sm font-semibold text-white" id="modal-playlist-channel">Channel Name</p>
                        <p class="text-xs text-zinc-400" id="modal-playlist-stats">0 videos • Last updated today</p>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="flex items-center space-x-2 mt-auto sm:mt-0">
                        <button class="flex-1 bg-white text-black font-bold py-2 px-4 rounded-full flex items-center justify-center space-x-2 hover:bg-zinc-200 transition">
                            <i class="fas fa-play"></i>
                            <span>Play all</span>
                        </button>
                        <button class="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white transition">
                            <i class="fas fa-random"></i>
                        </button>
                        <button class="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white transition">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white transition">
                            <i class="fas fa-share"></i>
                        </button>
                        <button class="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white transition">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Right Panel (Video List) -->
            <div class="flex-1 h-[55vh] sm:h-full overflow-y-auto bg-[#0f0f0f] relative custom-scrollbar">
                <div class="p-2 sm:p-6 pb-20 max-w-4xl mx-auto" id="modal-videos-grid">
                    <!-- Specific videos load here -->
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" defer></script>
    <script src="data.js" defer></script>
    <script src="playlists.js" defer></script>
</body>
</html>
