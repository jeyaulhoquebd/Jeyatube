<!DOCTYPE html>
<html lang="en" data-theme-lock="dark" class="dark-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTube - Playlists</title>
    <link rel="shortcut icon" href="img/jtubeimg.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-900 text-white font-sans antialiased min-h-screen flex flex-col">

    <header class="sticky top-0 z-40 bg-zinc-950/85 backdrop-blur-xl flex items-center justify-between gap-3 px-4 sm:px-6 py-3 border-b border-white/[.06]">
        <div class="flex items-center gap-3">
            <a href="index.html" class="w-9 h-9 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-300 hover:text-white" aria-label="Back to home"><i class="fas fa-arrow-left text-sm"></i></a>
            <a href="index.html" class="flex items-center gap-1 text-2xl font-black tracking-tighter brand-font"><span class="bg-gradient-to-br from-red-600 to-red-800 text-white px-2.5 py-0.5 rounded-lg shadow-lg shadow-red-600/20">J</span><span class="brand-logo-text">Tube</span></a>
        </div>
        <span id="playlist-total" class="text-xs text-zinc-400 font-semibold"></span>
    </header>

    <main class="flex-1 w-full max-w-7xl mx-auto p-4 sm:p-6">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl sm:text-3xl font-black tracking-tight">Course Playlists</h1>
                <p class="text-sm text-zinc-400 mt-1">Complete courses and series from every JTube channel — watch them in order.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-2">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs"></i>
                    <input id="playlist-search" class="w-full sm:w-64 bg-zinc-900 border border-zinc-800 focus:border-red-500 rounded-xl pl-9 pr-3 py-2.5 text-sm outline-none" placeholder="Search playlists…">
                </div>
                <select id="playlist-channel" class="bg-zinc-900 border border-zinc-800 focus:border-red-500 rounded-xl px-3 py-2.5 text-sm outline-none sm:w-56">
                    <option value="">All channels</option>
                </select>
            </div>
        </div>

        <div id="playlists-loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="aspect-video rounded-xl bg-zinc-800/60 animate-pulse"></div><div class="aspect-video rounded-xl bg-zinc-800/60 animate-pulse"></div>
            <div class="aspect-video rounded-xl bg-zinc-800/60 animate-pulse"></div><div class="aspect-video rounded-xl bg-zinc-800/60 animate-pulse"></div>
        </div>

        <div id="playlists-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-5 gap-y-8 hidden"></div>
        <div class="flex justify-center py-10"><button id="playlist-more" class="hidden px-6 py-2.5 rounded-full bg-zinc-800 hover:bg-zinc-700 text-sm font-semibold border border-white/10"><i class="fas fa-plus text-xs mr-1.5"></i>Load more</button></div>

        <!-- Video Modal for Playlist View (YouTube Style) -->
        <div id="playlist-modal" class="fixed inset-0 z-[100] bg-[#0f0f0f] hidden flex-col sm:flex-row overflow-hidden">
            <!-- Close button floating -->
            <button id="close-playlist" class="absolute top-4 right-4 z-50 bg-black/50 hover:bg-black p-2 rounded-full text-white transition">
                <i class="fas fa-times text-xl w-6 h-6 flex items-center justify-center"></i>
            </button>
            
            <!-- Left Panel (Sidebar) -->
            <div class="w-full sm:w-[380px] md:w-[420px] h-[45vh] sm:h-full flex-shrink-0 relative overflow-hidden flex flex-col p-6 sm:p-8 pt-12 sm:pt-8" id="modal-left-panel">
                <!-- Blurred Background -->
                <div id="modal-bg-img" class="absolute inset-0 bg-cover bg-center blur-3xl opacity-40 scale-150 transform"></div>
                <!-- Gradient overlay -->
                <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#0f0f0f] sm:bg-gradient-to-t"></div>
                
                <div class="relative z-10 flex flex-col h-full">
                    <!-- Thumbnail -->
                    <div class="w-full aspect-video rounded-xl overflow-hidden shadow-2xl mb-6 flex-shrink-0 relative group cursor-pointer">
                        <img id="modal-playlist-thumb" src="" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                            <div class="flex items-center space-x-2 text-white font-semibold">
                                <i class="fas fa-play"></i>
                                <span>Play all</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Info -->
                    <h2 class="text-2xl sm:text-3xl font-bold text-white mb-4 line-clamp-2 leading-tight" id="modal-playlist-name">Playlist Name</h2>
                    
                    <div class="space-y-1 mb-6">
                        <p class="text-sm font-semibold text-white" id="modal-playlist-channel">Channel Name</p>
                        <p class="text-xs text-zinc-400" id="modal-playlist-stats">0 videos • Last updated today</p>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="flex items-center gap-2 mt-auto sm:mt-0">
                        <button id="pl-play-all" class="flex-1 bg-white text-black font-bold py-2.5 px-4 rounded-full flex items-center justify-center gap-2 hover:bg-zinc-200 transition">
                            <i class="fas fa-play"></i><span>Play all</span>
                        </button>
                        <button id="pl-shuffle" class="w-11 h-11 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white transition" title="Shuffle"><i class="fas fa-random"></i></button>
                        <button id="pl-share" class="w-11 h-11 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white transition" title="Copy link"><i class="fas fa-share"></i></button>
                        <a id="pl-youtube" target="_blank" rel="noopener" class="w-11 h-11 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white transition" title="Open on YouTube"><i class="fab fa-youtube"></i></a>
                    </div>
                </div>
            </div>
            
            <!-- Right Panel (Video List) -->
            <div class="flex-1 h-[55vh] sm:h-full overflow-y-auto bg-[#0f0f0f] relative custom-scrollbar">
                <div class="p-2 sm:p-6 pb-20 max-w-4xl mx-auto" id="modal-videos-grid">
                    <!-- Specific videos load here -->
                </div>
            </div>
        </div>
    </main>

    <script src="env.js" defer></script>
    <script src="seed-data.js" defer></script>
    <script src="static-catalog.js" defer></script>
    <script src="data.js" defer></script>
    <script src="playlists.js" defer></script>
    <script src="firebase-init.js" defer></script>
</body>
</html>
