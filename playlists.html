<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTube - Playlists</title>
    <link rel="shortcut icon" href="img/jtubeimg.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-900 text-white font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-zinc-900 flex items-center justify-between px-6 py-4 border-b border-zinc-800">
        <a href="index.html" class="flex items-center space-x-1 text-xl font-bold tracking-tighter">
            <span class="bg-red-600 text-white px-2 py-0.5 rounded font-black">J</span>
            <span>Tube</span>
        </a>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-6">Course Playlists</h1>
        
        <div id="playlists-loading" class="text-center py-20 text-zinc-500">Loading playlists...</div>
        
        <div id="playlists-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden">
            <!-- Playlists load here -->
        </div>

        <!-- Video Modal for Playlist View -->
        <div id="playlist-modal" class="fixed inset-0 z-[100] bg-zinc-900/95 hidden flex flex-col pt-16">
            <div class="px-6 py-4 border-b border-zinc-800 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold" id="modal-playlist-name">Playlist Name</h2>
                    <p class="text-xs text-zinc-400" id="modal-playlist-count">0 videos</p>
                </div>
                <button id="close-playlist" class="text-zinc-400 hover:text-white"><i class="fas fa-times text-2xl"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-6">
                <div id="modal-videos-grid" class="max-w-4xl mx-auto space-y-4">
                    <!-- Specific videos load here -->
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" defer></script>
    <script src="data.js" defer></script>
    <script src="playlists.js" defer></script>
</body>
</html>
