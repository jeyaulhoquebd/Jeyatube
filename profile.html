<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTube - Profile</title>
    <link rel="shortcut icon" href="img/jtubeimg.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-900 text-white font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-zinc-900 flex items-center justify-between px-6 py-4 border-b border-zinc-800">
        <a href="index.html" class="flex items-center space-x-1 text-2xl font-black tracking-tighter brand-font"><span class="bg-gradient-to-br from-red-600 to-red-800 text-white px-2.5 py-0.5 rounded-lg shadow-lg shadow-red-600/20">J</span><span class="brand-logo-text">Tube</span></a>
        <a href="javascript:history.back()" class="flex items-center gap-2 text-sm text-zinc-400 hover:text-white transition px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-full">
            <i class="fas fa-arrow-left text-xs"></i> Back
        </a>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto">
        <!-- PUBLIC USER PROFILE VIEW (shown when ?user=email is in URL) -->
        <div id="public-profile-view" class="hidden">
            <div class="relative w-full h-48 md:h-64 bg-gradient-to-br from-zinc-800 via-zinc-900 to-zinc-800" id="public-profile-cover"></div>
            <div class="px-6 flex justify-between items-end relative -mt-12 md:-mt-16 mb-6">
                <div class="flex items-end space-x-4">
                    <div class="relative w-24 h-24 md:w-32 md:h-32 rounded-full border-4 border-zinc-900 bg-gradient-to-br from-purple-600 to-red-600 overflow-hidden flex items-center justify-center" id="public-profile-avatar">
                        <span id="public-avatar-letter" class="text-4xl font-bold text-white">U</span>
                    </div>
                    <div class="mb-2">
                        <h1 class="text-2xl md:text-3xl font-bold" id="public-profile-name">User</h1>
                        <p class="text-zinc-400 text-sm" id="public-profile-email"></p>
                    </div>
                </div>
            </div>
            <div class="px-6 pb-10">
                <div class="bg-zinc-800/40 border border-zinc-700/50 rounded-2xl p-6 text-center">
                    <i class="fas fa-user-circle text-4xl text-zinc-600 mb-3 block"></i>
                    <p class="text-zinc-400 text-sm">This is a public profile view.</p>
                    <p class="text-zinc-500 text-xs mt-1">Only the account owner can see watch history and saved videos.</p>
                </div>
            </div>
        </div>

        <!-- OWN PROFILE VIEW -->
        <div id="own-profile-view">
        <!-- Cover and Avatar Section -->
        <div class="relative w-full h-48 md:h-64 bg-zinc-800" id="profile-cover">
            <!-- Cover image goes here -->
        </div>
        <div class="px-6 flex justify-between items-end relative -mt-12 md:-mt-16 mb-6">
            <div class="flex items-end space-x-4">
                <div class="relative w-24 h-24 md:w-32 md:h-32 rounded-full border-4 border-zinc-900 bg-zinc-700 overflow-hidden" id="profile-avatar">
                    <!-- Avatar image goes here -->
                </div>
                <div class="mb-2">
                    <h1 class="text-2xl md:text-3xl font-bold" id="profile-name">User Name</h1>
                    <p class="text-zinc-400 text-sm" id="profile-email">user@email.com</p>
                </div>
            </div>
            <button id="edit-profile-btn" class="mb-2 bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-full font-semibold transition text-sm">
                Edit Profile
            </button>
        </div>

        <!-- Edit Form (Hidden) -->
        <div id="edit-form-container" class="hidden px-6 mb-8 bg-zinc-800/50 p-6 rounded-2xl mx-6 border border-zinc-700 shadow-lg">
            <h3 class="text-lg font-bold mb-4">Edit Profile Images</h3>
            <p class="text-xs text-zinc-400 mb-4">You can upload images to <a href="https://postimages.org/" target="_blank" class="text-blue-400 hover:underline">postimages.org</a> and paste the direct image link here.</p>
            <form id="profile-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Profile Picture Link (Direct Image URL)</label>
                    <input type="url" id="p-avatar-url" placeholder="https://..." class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Cover Photo Link (Direct Image URL)</label>
                    <input type="url" id="p-cover-url" placeholder="https://..." class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <div class="flex space-x-3">
                    <button type="button" id="cancel-edit-btn" class="flex-1 bg-zinc-700 hover:bg-zinc-600 font-bold p-3 rounded-xl transition text-sm">Cancel</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 font-bold p-3 rounded-xl transition text-sm">Save Changes</button>
                </div>
            </form>
        </div>

        <!-- History Section -->
        <div class="px-6 pb-10">
            <h2 class="text-xl font-bold mb-4 border-b border-zinc-800 pb-2">Your Watch History</h2>
            <div id="history-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
                <!-- History videos load here -->
            </div>
        </div>

        <!-- Saved Videos Section -->
        <div class="px-6 pb-10">
            <h2 class="text-xl font-bold mb-4 border-b border-zinc-800 pb-2">Saved Videos</h2>
            <div id="saved-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
                <!-- Saved videos load here -->
            </div>
        </div>
        </div> <!-- end own-profile-view -->
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" defer></script>
    <script src="env.js" defer></script>
    <script src="data.js" defer></script>
    <script src="profile.js" defer></script>
</body>
</html>
