<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTube - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-900 text-white font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-zinc-900 flex items-center justify-between px-6 py-4 border-b border-zinc-800">
        <a href="index.html" class="flex items-center space-x-1 text-xl font-bold tracking-tighter">
            <span class="bg-red-600 text-white px-2 py-0.5 rounded font-black">J</span>
            <span>Tube</span>
        </a>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto">
        <!-- Cover and Avatar Section -->
        <div class="relative w-full h-48 md:h-64 bg-zinc-800" id="profile-cover">
            <!-- Cover image goes here -->
        </div>
        <div class="px-6 flex justify-between items-end relative -mt-12 md:-mt-16 mb-6">
            <div class="flex items-end space-x-4">
                <div class="relative w-24 h-24 md:w-32 md:h-32 rounded-full border-4 border-zinc-900 bg-zinc-700 overflow-hidden" id="profile-avatar">
                    <!-- Avatar image goes here -->
                </div>
                <div class="mb-2">
                    <h1 class="text-2xl md:text-3xl font-bold" id="profile-name">User Name</h1>
                    <p class="text-zinc-400 text-sm" id="profile-email">user@email.com</p>
                </div>
            </div>
            <button id="edit-profile-btn" class="mb-2 bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-full font-semibold transition text-sm">
                Edit Profile
            </button>
        </div>

        <!-- Edit Form (Hidden) -->
        <div id="edit-form-container" class="hidden px-6 mb-8 bg-zinc-800/50 p-6 rounded-2xl mx-6 border border-zinc-700 shadow-lg">
            <h3 class="text-lg font-bold mb-4">Edit Profile Images</h3>
            <p class="text-xs text-zinc-400 mb-4">You can upload images to <a href="https://postimages.org/" target="_blank" class="text-blue-400 hover:underline">postimages.org</a> and paste the direct image link here.</p>
            <form id="profile-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Profile Picture Link (Direct Image URL)</label>
                    <input type="url" id="p-avatar-url" placeholder="https://..." class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Cover Photo Link (Direct Image URL)</label>
                    <input type="url" id="p-cover-url" placeholder="https://..." class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <div class="flex space-x-3">
                    <button type="button" id="cancel-edit-btn" class="flex-1 bg-zinc-700 hover:bg-zinc-600 font-bold p-3 rounded-xl transition text-sm">Cancel</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 font-bold p-3 rounded-xl transition text-sm">Save Changes</button>
                </div>
            </form>
        </div>

        <!-- History Section -->
        <div class="px-6 pb-10">
            <h2 class="text-xl font-bold mb-4 border-b border-zinc-800 pb-2">Your Watch History</h2>
            <div id="history-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- History videos load here -->
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="data.js"></script>
    <script src="profile.js"></script>
</body>
</html>
