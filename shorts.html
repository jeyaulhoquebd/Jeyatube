<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JTube Shorts</title>
    <meta name="description" content="Watch trending short videos on JTube Shorts.">
    <meta property="og:title" content="JTube Shorts">
    <link rel="shortcut icon" href="img/jtubeimg.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #09090b;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }
        .short-viewport {
            height: calc(100vh - 60px);
            height: calc(100dvh - 60px);
        }
        @media (max-width: 640px) {
            .short-viewport {
                height: 100vh;
                height: 100dvh;
            }
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(39, 39, 42, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            width: 48px;
            height: 48px;
            border-radius: 9999px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .action-btn:hover {
            background: rgba(239, 68, 68, 0.8);
            transform: scale(1.08);
            border-color: rgba(239, 68, 68, 0.5);
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .action-label {
            font-size: 11px;
            font-weight: 600;
            color: #e4e4e7;
            margin-top: 4px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .comments-drawer {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .comments-drawer.closed {
            transform: translateY(100%);
        }
        @media (min-width: 768px) {
            .comments-drawer.closed {
                transform: translateX(100%);
            }
        }
    </style>
</head>
<body class="bg-zinc-950 text-white select-none">

    <!-- Top Navigation Header -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-gradient-to-b from-black/80 via-black/40 to-transparent p-4 flex items-center justify-between pointer-events-auto">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="action-btn !w-10 !h-10 text-white hover:bg-zinc-800" title="Back to Home">
                <i class="fas fa-arrow-left text-sm"></i>
            </a>
            <div class="flex items-center space-x-1.5 font-black text-lg tracking-tight">
                <span class="w-7 h-7 rounded-lg bg-red-600 flex items-center justify-center text-white shadow-lg shadow-red-600/40">
                    <i class="fas fa-bolt text-xs"></i>
                </span>
                <span class="text-white">Shorts</span>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <span id="shorts-counter" class="text-xs bg-zinc-900/80 backdrop-blur px-3 py-1 rounded-full border border-zinc-800 text-zinc-300 font-mono">1 / 1</span>
            <button id="btn-sound-toggle" class="action-btn !w-10 !h-10" title="Toggle Sound">
                <i id="sound-icon" class="fas fa-volume-up text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Shorts Reel Container -->
    <div class="relative w-full h-screen flex items-center justify-center overflow-hidden">
        
        <!-- Blurred background thumbnail for theater mood on desktop -->
        <div id="shorts-bg-blur" class="absolute inset-0 bg-cover bg-center filter blur-3xl opacity-20 scale-125 transition-all duration-700 pointer-events-none"></div>

        <!-- Vertical Video Stage -->
        <div class="relative flex items-center justify-center w-full h-full max-w-full sm:max-w-[420px] mx-auto">
            
            <!-- 9:16 Video Frame -->
            <div id="short-video-container" class="relative w-full h-full sm:h-[90vh] sm:rounded-3xl overflow-hidden bg-black shadow-2xl border border-zinc-800/80 flex items-center justify-center">
                
                <!-- Loading Spinner -->
                <div id="short-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-950 z-20 transition-opacity duration-300">
                    <div class="w-12 h-12 border-4 border-zinc-800 border-t-red-600 rounded-full animate-spin mb-3"></div>
                    <p class="text-xs text-zinc-400 font-medium tracking-wide">Loading Short...</p>
                </div>

                <!-- Video Element Mount / Iframe Holder -->
                <div id="short-player-mount" class="w-full h-full relative">
                    <!-- Injected dynamically -->
                </div>

                <!-- Touch / Click Overlay for Play/Pause -->
                <div id="short-touch-layer" class="absolute inset-0 z-10 cursor-pointer"></div>

                <!-- Play/Pause Pulsing Icon Overlay -->
                <div id="play-pulse-icon" class="absolute inset-0 flex items-center justify-center pointer-events-none z-20 opacity-0 transition-opacity duration-200">
                    <div class="w-16 h-16 rounded-full bg-black/60 backdrop-blur-md text-white flex items-center justify-center text-2xl shadow-xl">
                        <i id="play-pulse-i" class="fas fa-play"></i>
                    </div>
                </div>

                <!-- Bottom Gradient Scrim for readable text -->
                <div class="absolute inset-x-0 bottom-0 h-56 bg-gradient-to-t from-black via-black/60 to-transparent pointer-events-none z-20"></div>

                <!-- Bottom Meta Overlay (Channel, Title, Audio) -->
                <div class="absolute left-4 right-16 bottom-5 z-30 pointer-events-auto space-y-3">
                    
                    <!-- Channel Info & Subscribe -->
                    <div class="flex items-center space-x-2.5">
                        <a id="short-channel-link" href="#" class="flex items-center space-x-2 group">
                            <img id="short-channel-avatar" src="" alt="Avatar" class="w-9 h-9 rounded-full object-cover border border-white/20 group-hover:scale-105 transition">
                            <span id="short-channel-name" class="font-bold text-sm text-white drop-shadow group-hover:text-red-400 transition truncate max-w-[140px]">Channel</span>
                            <img src="img/icons.svg" class="w-3.5 h-3.5" alt="Verified">
                        </a>
                        <button id="short-subscribe-btn" class="bg-red-600 hover:bg-red-500 active:scale-95 text-white text-xs font-bold px-3 py-1.5 rounded-full transition shadow-md">
                            Subscribe
                        </button>
                    </div>

                    <!-- Short Title -->
                    <p id="short-title" class="text-sm font-medium text-zinc-100 line-clamp-2 leading-snug drop-shadow-md">
                        Short Video Title
                    </p>

                    <!-- Original Audio Badge -->
                    <div class="flex items-center space-x-2 text-xs text-zinc-300 font-medium">
                        <i class="fas fa-music text-[10px] text-red-400 animate-spin" style="animation-duration: 4s;"></i>
                        <span id="short-audio-text" class="truncate max-w-[200px]">Original sound</span>
                    </div>

                    <!-- Progress Bar -->
                    <div class="w-full bg-white/20 h-1 rounded-full overflow-hidden mt-2">
                        <div id="short-progress-bar" class="bg-red-600 h-full w-0 transition-all duration-100 ease-linear"></div>
                    </div>
                </div>

                <!-- Right Action Rail (Like, Dislike, Comments, Share, AI) -->
                <div class="absolute right-3 bottom-8 z-30 flex flex-col items-center space-y-4 pointer-events-auto">
                    
                    <!-- Like Button -->
                    <div class="flex flex-col items-center">
                        <button id="short-like-btn" class="action-btn" title="Like this Short">
                            <i id="short-like-icon" class="fas fa-thumbs-up text-base"></i>
                        </button>
                        <span id="short-like-count" class="action-label">0</span>
                    </div>

                    <!-- Dislike Button -->
                    <div class="flex flex-col items-center">
                        <button id="short-dislike-btn" class="action-btn" title="Dislike">
                            <i id="short-dislike-icon" class="fas fa-thumbs-down text-base"></i>
                        </button>
                        <span class="action-label">Dislike</span>
                    </div>

                    <!-- Comments Button -->
                    <div class="flex flex-col items-center">
                        <button id="short-comments-btn" class="action-btn" title="View Comments">
                            <i class="fas fa-comment-dots text-base"></i>
                        </button>
                        <span id="short-comment-count" class="action-label">0</span>
                    </div>

                    <!-- Share Button -->
                    <div class="flex flex-col items-center">
                        <button id="short-share-btn" class="action-btn" title="Share Short">
                            <i class="fas fa-share text-base"></i>
                        </button>
                        <span class="action-label">Share</span>
                    </div>

                    <!-- JAsk AI Button -->
                    <div class="flex flex-col items-center">
                        <button id="short-ai-btn" class="action-btn !border-purple-500/40 hover:!bg-purple-600" title="Ask AI About This Short">
                            <i class="fas fa-robot text-purple-300 text-base"></i>
                        </button>
                        <span class="action-label text-purple-300">JAsk</span>
                    </div>
                </div>

            </div>

            <!-- Desktop Vertical Navigation Arrows -->
            <div class="hidden md:flex flex-col space-y-3 absolute -right-16 top-1/2 -translate-y-1/2">
                <button id="btn-prev-short" class="action-btn hover:!bg-zinc-800" title="Previous Short (Arrow Up)">
                    <i class="fas fa-chevron-up"></i>
                </button>
                <button id="btn-next-short" class="action-btn hover:!bg-zinc-800" title="Next Short (Arrow Down)">
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Sliding Comments Drawer -->
    <div id="comments-drawer" class="comments-drawer closed fixed inset-x-0 bottom-0 sm:inset-y-0 sm:right-0 sm:left-auto sm:w-96 bg-zinc-900/95 backdrop-blur-xl border-t sm:border-t-0 sm:border-l border-zinc-800 z-50 flex flex-col shadow-2xl max-h-[75vh] sm:max-h-full rounded-t-3xl sm:rounded-none">
        <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <h3 class="font-bold text-base text-white">Comments</h3>
                <span id="drawer-comment-count" class="text-xs bg-zinc-800 px-2 py-0.5 rounded-full text-zinc-400">0</span>
            </div>
            <button id="close-comments-drawer" class="text-zinc-400 hover:text-white p-1 rounded-full">
                <i class="fas fa-times text-lg"></i>
            </button>
        </div>
        
        <!-- Comments List -->
        <div id="comments-list-container" class="flex-1 overflow-y-auto p-4 space-y-4">
            <p class="text-zinc-500 text-center py-6 text-xs">No comments yet. Be the first to comment!</p>
        </div>

        <!-- Add Comment Form -->
        <div class="p-4 border-t border-zinc-800 bg-zinc-950/80">
            <form id="short-comment-form" class="flex items-center gap-2">
                <input type="text" id="short-comment-input" placeholder="Add a comment..." required
                       class="flex-1 bg-zinc-800 border border-zinc-700 rounded-full px-4 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-red-500">
                <button type="submit" class="bg-red-600 hover:bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center text-xs transition flex-shrink-0">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" defer></script>
    <script src="https://www.youtube.com/iframe_api" defer></script>
    <script src="env.js" defer></script>
    <script src="seed-data.js" defer></script>
    <script src="data.js" defer></script>
    <script src="shorts.js" defer></script>
</body>
</html>
