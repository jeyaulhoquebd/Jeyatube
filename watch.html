<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTube - Watching Video</title>
    <meta name="description" content="Watch videos on JTube.">
    <link rel="shortcut icon" href="img/jtubeimg.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-900 text-white font-sans antialiased">

    <header class="bg-zinc-900 flex items-center px-4 py-3 border-b border-zinc-800">
        <a href="index.html" class="flex items-center space-x-1 text-2xl font-black tracking-tighter brand-font"><span class="bg-gradient-to-br from-red-600 to-red-800 text-white px-2.5 py-0.5 rounded-lg shadow-lg shadow-red-600/20">J</span><span class="brand-logo-text">Tube</span></a>
    </header>

    <main class="max-w-6xl mx-auto p-4 lg:py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <section class="lg:col-span-2 space-y-4">
            <div class="w-full bg-black rounded-2xl overflow-hidden aspect-video shadow-lg">
                <video id="video-player" controls class="w-full h-full" autoplay src=""></video>
            </div>

            <h1 id="video-title" class="text-xl font-bold line-clamp-2 md:text-2xl">Loading video title...</h1>
            
            <div class="flex flex-wrap items-center justify-between gap-4 py-2 border-b border-zinc-800 pb-4">
                <div class="flex items-center space-x-3 cursor-pointer group" onclick="location.href='channel.html?name=' + encodeURIComponent(document.getElementById('channel-name').textContent)">
                    <div id="channel-avatar" class="bg-zinc-700 w-10 h-10 rounded-full flex items-center justify-center font-bold flex-shrink-0">J</div>
                    <div>
                        <div class="flex items-center space-x-1">
                            <h4 id="channel-name" class="font-bold text-sm group-hover:text-zinc-300 transition">Channel Name</h4>
                            <img src="img/icons.svg" class="w-3.5 h-3.5" alt="Verified" title="Verified">
                        </div>
                        <p id="channel-subs" class="text-xs text-zinc-400">0 subscribers</p>
                    </div>
                    <button id="subscribe-btn" class="ml-4 bg-white text-black px-4 py-2 rounded-full font-semibold text-xs md:text-sm hover:bg-zinc-200 transition">
                        Subscribe
                    </button>
                </div>

                <div class="flex items-center space-x-2">
                    <button id="like-btn" class="bg-zinc-800 hover:bg-zinc-700 text-sm font-semibold px-4 py-2 rounded-full flex items-center space-x-2 transition">
                        <i class="far fa-thumbs-up"></i> <span id="like-count">0</span>
                    </button>
                </div>
            </div>

            <div class="bg-zinc-800 p-3 rounded-xl text-sm leading-relaxed">
                <p id="video-meta" class="font-semibold text-xs text-zinc-300 mb-1">0 views • Just now</p>
                <p id="video-desc" class="text-zinc-300 whitespace-pre-line"></p>
            </div>

            <div class="space-y-4">
                <h3 class="text-lg font-bold"><span id="comment-count">0</span> Comments</h3>
                <form id="comment-form" class="flex gap-3 items-start">
                    <a href="profile.html" class="bg-purple-600 w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0 text-white">U</a>
                    <div class="w-full space-y-2">
                        <input id="comment-input" type="text" placeholder="Add a public comment..." class="w-full bg-transparent border-b border-zinc-700 focus:border-white focus:outline-none py-1 text-sm text-white">
                        <div class="flex justify-end space-x-2">
                            <button type="button" id="cancel-comment" class="px-3 py-1.5 rounded-full text-xs font-semibold hover:bg-zinc-800">Cancel</button>
                            <button type="submit" class="bg-blue-600 px-4 py-1.5 rounded-full text-xs font-semibold hover:bg-blue-500">Comment</button>
                        </div>
                    </div>
                </form>
                <div id="comments-list" class="space-y-4 pt-2"></div>
            </div>
        </section>

        <aside id="recommendations" class="space-y-4">
            <h3 class="text-sm font-bold text-zinc-400 tracking-wider uppercase mb-1">Up Next</h3>
        </aside>
    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 hidden backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-700 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold" id="auth-title">Login Required</h2>
                <button id="close-auth" class="text-zinc-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="auth-form" class="space-y-4">
                <div id="name-group" class="hidden">
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Full Name</label>
                    <input type="text" id="auth-name" class="w-full bg-zinc-800 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Email Address</label>
                    <input type="email" id="auth-email" required class="w-full bg-zinc-800 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-zinc-800 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold p-3 rounded-xl transition">
                    <span id="auth-submit-text">Login</span>
                </button>
            </form>
            <p class="text-center text-xs text-zinc-400 mt-6">
                <span id="auth-switch-text">Don't have an account?</span>
                <button id="auth-switch-btn" class="text-blue-400 hover:text-blue-300 font-bold">Register</button>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" defer></script>
    <script src="data.js" defer></script>
    <script src="watch.js" defer></script>
</body>
</html>
