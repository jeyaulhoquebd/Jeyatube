<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTube - All Channels</title>
    <link rel="shortcut icon" href="img/jtubeimg.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b0e14] text-white font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-[#0e1117] sticky top-0 z-40 flex items-center justify-between px-6 py-3.5 border-b border-white/[0.08] backdrop-blur-md">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="flex items-center space-x-2 text-xl font-bold tracking-tight brand-font">
                <span class="bg-red-600 text-white w-7 h-7 rounded-lg flex items-center justify-center text-sm font-black shadow-md shadow-red-600/30">J</span>
                <span class="brand-logo-text text-white">JTube</span>
            </a>
            <span class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <i class="fas fa-certificate text-[9px]"></i> Curated Creators
            </span>
        </div>
        
        <div class="flex items-center space-x-2">
            <a href="index.html" class="text-xs font-semibold text-zinc-300 hover:text-white bg-white/[0.05] hover:bg-white/[0.1] border border-white/[0.08] px-3.5 py-1.5 rounded-xl transition flex items-center gap-1.5">
                <i class="fas fa-compass text-xs"></i>
                <span>Explore Catalog</span>
            </a>
            <button class="theme-toggle-btn p-2 hover:bg-white/[0.08] rounded-xl text-zinc-300 hover:text-white transition" title="Toggle Theme (Auto System / Dark / Light)">
                <i class="fas fa-moon theme-icon"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto p-6">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2.5">
                    <span>Curated Channels</span>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">Verified Quality</span>
                </h1>
                <p class="text-xs text-zinc-400 mt-1">High-signal educational educators, researchers, and scientific producers.</p>
            </div>
        </div>
        
        <div id="channels-loading" class="text-center py-20 text-zinc-500">Loading channels...</div>
        
        <div id="channels-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Channels load here -->
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 hidden backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-700 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold" id="auth-title">Login Required</h2>
                <button id="close-auth" class="text-zinc-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="auth-form" class="space-y-4">
                <div id="name-group" class="hidden">
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Full Name</label>
                    <input type="text" id="auth-name" class="w-full bg-zinc-800 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Email Address</label>
                    <input type="email" id="auth-email" required class="w-full bg-zinc-800 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-zinc-800 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold p-3 rounded-xl transition">
                    <span id="auth-submit-text">Login</span>
                </button>
            </form>
            <div class="mt-6 flex items-center before:mt-0.5 before:flex-1 before:border-t before:border-zinc-700 after:mt-0.5 after:flex-1 after:border-t after:border-zinc-700">
                <p class="mx-4 text-center text-xs font-semibold text-zinc-400">OR</p>
            </div>
            <button id="google-auth-btn" class="mt-6 w-full flex items-center justify-center space-x-2 bg-white text-black hover:bg-zinc-200 font-bold p-3 rounded-xl transition">
                <i class="fab fa-google text-red-500"></i>
                <span>Continue with Google</span>
            </button>
            <p class="text-center text-xs text-zinc-400 mt-6">
                <span id="auth-switch-text">Don't have an account?</span>
                <button id="auth-switch-btn" class="text-blue-400 hover:text-blue-300 font-bold">Register</button>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" defer></script>
    <script src="seed-data.js" defer></script>
    <script src="data.js" defer></script>
    <script src="channels.js" defer></script>
</body>
</html>
