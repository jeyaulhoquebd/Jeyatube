<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTube - Channel</title>
    <meta name="description" content="Browse channel videos and playlists on JTube.">
    <link rel="shortcut icon" href="img/jtubeimg.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .channel-tab { border-bottom: 2px solid transparent; transition: border-color .2s, color .2s; }
        .channel-tab.active { border-bottom-color: #fff; color: #fff; }
        .channel-tab:not(.active) { color: #a1a1aa; }
        .channel-tab:not(.active):hover { color: #d4d4d8; background: rgba(255,255,255,.05); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* YouTube-style playlist card */
        .playlist-card { position: relative; cursor: pointer; border-radius: .75rem; overflow: hidden; background: #27272a; transition: transform .2s; }
        .playlist-card:hover { transform: translateY(-3px); }
        .playlist-stack { position: relative; }
        .playlist-stack::before, .playlist-stack::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 100%;
            background: #3f3f46;
            border-radius: .6rem;
            z-index: 0;
        }
        .playlist-stack::before { top: -6px; width: 85%; background: #3f3f46; }
        .playlist-stack::after  { top: -12px; width: 80%; background: #52525b; }
        .playlist-thumb { position: relative; z-index: 1; border-radius: .6rem; overflow: hidden; aspect-ratio: 16/9; }
        .playlist-count-badge {
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 38%;
            background: rgba(0,0,0,.82);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border-radius: 0 .6rem .6rem 0;
            gap: 4px;
        }
    </style>
</head>
<body class="bg-zinc-900 text-white font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-zinc-900 flex items-center justify-between px-6 py-4 border-b border-zinc-800">
        <a href="index.html" class="flex items-center space-x-1 text-2xl font-black tracking-tighter brand-font"><span class="bg-gradient-to-br from-red-600 to-red-800 text-white px-2.5 py-0.5 rounded-lg shadow-lg shadow-red-600/20">J</span><span class="brand-logo-text">Tube</span></a>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto">
        <div id="channel-loading" class="text-center py-20 text-zinc-500">Loading channel...</div>
        
        <div id="channel-content" class="hidden">
            <!-- Cover Photo -->
            <div class="relative w-full h-36 sm:h-48 md:h-60 bg-zinc-800 overflow-hidden" id="channel-cover"></div>
            
            <!-- Channel Info -->
            <div class="px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-start sm:items-end relative -mt-10 sm:-mt-14 mb-4">
                <div class="flex flex-col sm:flex-row items-start sm:items-end sm:space-x-5">
                    <div class="relative w-20 h-20 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-full border-4 border-zinc-900 bg-zinc-700 overflow-hidden flex-shrink-0" id="channel-avatar"></div>
                    <div class="mt-3 sm:mt-0 sm:mb-2">
                        <h1 class="text-xl sm:text-2xl md:text-3xl font-black" id="channel-name-title">Channel Name</h1>
                        <p class="text-zinc-400 text-sm" id="channel-subs">0 subscribers</p>
                        <p class="text-zinc-400 text-sm mt-0.5" id="channel-video-count"></p>
                    </div>
                </div>
                <button id="subscribe-btn" class="mt-4 sm:mt-0 sm:mb-2 bg-white text-black px-6 py-2 rounded-full font-semibold transition text-sm hover:bg-zinc-200 flex-shrink-0">
                    Subscribe
                </button>
            </div>

            <!-- Channel Tabs (YouTube-style) -->
            <div class="border-b border-zinc-800 px-4 sm:px-6">
                <div class="flex space-x-1 overflow-x-auto" style="scrollbar-width:none;">
                    <button class="channel-tab active px-4 py-3 text-sm font-semibold whitespace-nowrap rounded-t-lg" data-tab="videos">
                        Videos
                    </button>
                    <button class="channel-tab px-4 py-3 text-sm font-semibold whitespace-nowrap rounded-t-lg" data-tab="playlists">
                        Playlists
                    </button>
                    <button class="channel-tab px-4 py-3 text-sm font-semibold whitespace-nowrap rounded-t-lg" data-tab="about">
                        About
                    </button>
                </div>
            </div>

            <!-- Videos Tab -->
            <div id="tab-videos" class="tab-content active px-4 sm:px-6 py-6">
                <div id="channel-videos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <p class="col-span-full text-zinc-500 py-4">Loading videos...</p>
                </div>
            </div>

            <!-- Playlists Tab -->
            <div id="tab-playlists" class="tab-content px-4 sm:px-6 py-6">
                <div id="channel-playlists" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <p class="col-span-full text-zinc-500 py-4">No playlists yet.</p>
                </div>
            </div>

            <!-- About Tab -->
            <div id="tab-about" class="tab-content px-4 sm:px-6 py-6 max-w-2xl">
                <h2 class="text-lg font-bold mb-3">About</h2>
                <p id="channel-bio" class="text-zinc-300 text-sm leading-relaxed whitespace-pre-line mb-6"></p>
                <div id="channel-links" class="flex flex-wrap gap-3"></div>
            </div>
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 hidden backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-700 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold" id="auth-title">Login Required</h2>
                <button id="close-auth" class="text-zinc-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="auth-form" class="space-y-4">
                <div id="name-group" class="hidden">
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Full Name</label>
                    <input type="text" id="auth-name" class="w-full bg-zinc-800 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Email Address</label>
                    <input type="email" id="auth-email" required class="w-full bg-zinc-800 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-zinc-800 border border-zinc-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold p-3 rounded-xl transition">
                    <span id="auth-submit-text">Login</span>
                </button>
            </form>
            <div class="mt-6 flex items-center before:mt-0.5 before:flex-1 before:border-t before:border-zinc-700 after:mt-0.5 after:flex-1 after:border-t after:border-zinc-700">
                <p class="mx-4 text-center text-xs font-semibold text-zinc-400">OR</p>
            </div>
            <button id="google-auth-btn" class="mt-6 w-full flex items-center justify-center space-x-2 bg-white text-black hover:bg-zinc-200 font-bold p-3 rounded-xl transition">
                <i class="fab fa-google text-red-500"></i>
                <span>Continue with Google</span>
            </button>
            <p class="text-center text-xs text-zinc-400 mt-6">
                <span id="auth-switch-text">Don't have an account?</span>
                <button id="auth-switch-btn" class="text-blue-400 hover:text-blue-300 font-bold">Register</button>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" defer></script>
    <script src="data.js" defer></script>
    <script src="channel.js" defer></script>
</body>
</html>
