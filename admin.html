<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTube Studio - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-900 text-white font-sans antialiased">

    <!-- Admin Login Overlay -->
    <div id="admin-login-overlay" class="fixed inset-0 z-[200] bg-zinc-900 flex items-center justify-center">
        <div class="bg-zinc-800 p-8 rounded-2xl w-full max-w-sm shadow-2xl border border-zinc-700 text-center">
            <div class="inline-flex bg-red-600 text-white w-16 h-16 items-center justify-center rounded-full text-3xl mb-4">
                <i class="fas fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Admin Access</h2>
            <p class="text-xs text-zinc-400 mb-6">Enter the master password to access JTube Studio.</p>
            <form id="admin-login-form" class="space-y-4">
                <input type="password" id="admin-password" placeholder="Enter Password" required class="w-full bg-zinc-900 border border-zinc-700 focus:border-red-500 rounded-xl p-3 text-sm text-center text-white focus:outline-none tracking-widest">
                <button type="submit" class="w-full bg-red-600 hover:bg-red-500 font-bold p-3 rounded-xl transition">
                    Unlock Studio
                </button>
            </form>
            <a href="index.html" class="block mt-4 text-xs text-zinc-500 hover:text-white transition">Return to Home</a>
        </div>
    </div>

    <header class="sticky top-0 bg-zinc-900 z-50 flex items-center justify-between px-6 py-4 border-b border-zinc-800">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="flex items-center space-x-1 text-xl font-bold tracking-tighter">
                <span class="bg-red-600 text-white px-2 py-0.5 rounded font-black">J</span>
                <span>Tube <span class="text-xs text-zinc-400 font-normal ml-1">Studio</span></span>
            </a>
        </div>
        <div class="flex items-center space-x-4">
            <a href="index.html" class="text-sm bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-full transition font-medium">
                <i class="fas fa-eye mr-1"></i> View Site
            </a>
            <div class="bg-red-600 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">A</div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <section class="lg:col-span-1 bg-zinc-800/50 p-5 rounded-2xl border border-zinc-800 h-fit space-y-4">
            <div class="border-b border-zinc-800 pb-2">
                <h2 class="text-lg font-bold text-zinc-100">Upload New Video</h2>
                <p class="text-xs text-zinc-400">Add dynamic curated content directly to the platform.</p>
            </div>

            <form id="upload-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Video Title</label>
                    <input type="text" id="v-title" required placeholder="e.g., Introduction to Quantum Computing" class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 focus:outline-none rounded-xl p-2.5 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Category</label>
                        <select id="v-category" class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 focus:outline-none rounded-xl p-2.5 text-sm text-zinc-300">
                            <option value="Islam">Islam</option>
                            <option value="Science">Science</option>
                            <option value="AI">AI</option>
                            <option value="Machine Learning">Machine Learning</option>
                            <option value="Entertainment">Entertainment</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Duration</label>
                        <input type="text" id="v-duration" required placeholder="e.g., 14:20" class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 focus:outline-none rounded-xl p-2.5 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Channel Name</label>
                    <input type="text" id="v-channel" required placeholder="e.g., Tech Minds" class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 focus:outline-none rounded-xl p-2.5 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Thumbnail Image URL</label>
                    <input type="url" id="v-thumbnail" placeholder="Paste image link or leave empty for random stock" class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 focus:outline-none rounded-xl p-2.5 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Video Source File URL</label>
                    <input type="url" id="v-url" placeholder="Paste .mp4 file link or leave empty for default stream" class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 focus:outline-none rounded-xl p-2.5 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Video Description</label>
                    <textarea id="v-desc" rows="3" placeholder="Provide video details..." class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 focus:outline-none rounded-xl p-2.5 text-sm"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold p-2.5 rounded-xl transition text-sm">
                    Publish Video
                </button>
            </form>
        </section>

        <section class="lg:col-span-2 bg-zinc-800/50 p-5 rounded-2xl border border-zinc-800 space-y-4">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
                <div>
                    <h2 class="text-lg font-bold text-zinc-100">Manage Videos</h2>
                    <p class="text-xs text-zinc-400">Overview of all active database items uploaded on JTube.</p>
                </div>
                <div class="bg-zinc-700 px-3 py-1 rounded-full text-xs font-bold text-zinc-300">
                    Total: <span id="video-count">0</span>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-zinc-300">
                    <thead class="text-xs uppercase bg-zinc-900/60 text-zinc-400 border-b border-zinc-800">
                        <tr>
                            <th scope="col" class="px-4 py-3">Video info</th>
                            <th scope="col" class="px-4 py-3 hidden sm:table-cell">Channel</th>
                            <th scope="col" class="px-4 py-3">Category</th>
                            <th scope="col" class="px-4 py-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-zinc-800">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="data.js"></script>
    <script src="admin.js"></script>
</body>
</html>
