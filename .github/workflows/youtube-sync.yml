name: YouTube → Firestore sync

# Imports every video/Short of the JTube channels into Firestore and keeps
# picking up new uploads. Needs two repository secrets (Settings → Secrets and
# variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  – JSON key of a service account of project "jeyatube"
#   YOUTUBE_API_KEY           – YouTube Data API v3 key
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: youtube-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync
        run: node scripts/sync-firestore.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIREBASE_PROJECT_ID: jeyatube
