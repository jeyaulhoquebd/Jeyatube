name: Update video catalog

# Keeps the JTube video library up to date. Every 3 hours it looks for new uploads on all
# connected YouTube channels (and keeps importing older videos until everything is in),
# writes the result to ./catalog and commits it. Cloudflare Pages then redeploys the site.
#
# One repository secret is required (Settings → Secrets and variables → Actions):
#   YOUTUBE_API_KEY             YouTube Data API v3 key
# Optional:
#   FIREBASE_SERVICE_ACCOUNT    lets the admin studio's channel list / hidden videos take effect
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: catalog-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build catalog
        run: node scripts/build-catalog.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: jeyatube
          RUN_QUOTA: "1100"
          MAX_RUN_SECONDS: "900"
      - name: Commit changes
        run: |
          git config user.name "jtube-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog
          if git diff --cached --quiet; then
            echo "No new videos."
          else
            git commit -m "Update video catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
